name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the tag and write the notes
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Run the tests
        run: python plugins/review-doc/tests/run.py
      - name: Package the VS Code opener
        working-directory: plugins/review-doc/vscode-opener
        run: npx --yes @vscode/vsce package -o review-doc-opener.vsix
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          plugins/review-doc/vscode-opener/review-doc-opener.vsix
          --title "review-doc $GITHUB_REF_NAME"
          --notes-file notes.md
